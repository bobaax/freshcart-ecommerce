<section class="bg-gray-200 my-14 p-10 md:w-1/2 m-auto">
    <div class="container">

<ol class="flex items-center w-full text-sm font-medium text-center text-gray-500 dark:text-gray-400 sm:text-base">
    <li [class.text-[var(--main-color)]]="step == 1" class="flex md:w-full items-center  sm:after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
        <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
            </svg>
            <span class="hidden sm:inline-flex sm:ms-2">Verify Email</span>
        </span>
    </li>
    <li [class.text-[var(--main-color)]]="step == 2" class="flex md:w-full items-center after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
        <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
            <span class="me-2">2</span>
            <span class="hidden sm:inline-flex sm:ms-2">Verify Code</span>
        </span>
    </li>
    <li [class.text-[var(--main-color)]]="step == 3" class="flex items-center">
        <span class="me-2">3</span>
        Reset Password
    </li>
</ol>

        @if (step ==1) {
            <form [formGroup]="verifyEmail" (ngSubmit)="formStepOne()">
            <app-input
                [control]="verifyEmail.get('email')"
                [labelInput]="'Email Address'"
                [typeInput]="'email'"
                [idInput]="'email'"
            ></app-input>
            <button type="submit" class="btn-main">Verify Email</button>
        </form>
        }
        @if (step ==2) {
        <form [formGroup]="verifyCode" (ngSubmit)="formStepTwo()">
            <app-input
                [control]="verifyCode.get('resetCode')"
                [labelInput]="'Reset Code'"
                [typeInput]="'text'"
                [idInput]="'resetCode'"
            ></app-input>
            <button type="submit" class="btn-main">Verify Code</button>
        </form>
    }
        @if (step ==3) {
        <form [formGroup]="resetPassword" (ngSubmit)="formStepThree()">
            <app-input
                [control]="resetPassword.get('email')"
                [labelInput]="'Email Address'"
                [typeInput]="'email'"
                [idInput]="'email'"
            ></app-input>
            <app-input
                [control]="resetPassword.get('newPassword')"
                [labelInput]="'New Password'"
                [idInput]="'newPassword'"
            ></app-input>
            <button type="submit" class="btn-main">Reset Password</button>
        </form>
    }


    </div>
</section>

<div class="container mb-6">
    <h2 class="text-4xl font-semibold mb-4 mt-4 text-[var(--main-color)]">Categories</h2>
    <div class="parent grid lg:grid-cols-4 md:grid-cols-3 grid-cols-2  gap-4 mt-10">
            @for (category of categoriesList;track category._id) {
            <div  class="card overflow-hidden bg-white border rounded shadow-md p-1 group/card">
    <div [routerLink]="['/details',category.slug,category._id]" class="cursor-pointer">
        <img [src]="category.image" class="w-full object-cover rounded-t" [alt]="category.name">
    <h3 class="text-sm text-center font-semibold mt-2 text-green-500"> {{ category.name }}</h3>
    </div>
            </div>
            }
    </div>
</div>

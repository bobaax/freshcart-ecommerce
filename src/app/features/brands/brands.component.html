<div class="container mb-6">
  <h2 class="text-4xl font-semibold mb-4 mt-4 text-[var(--main-color)]">Brands</h2>

  @if (!brandsLoaded) {
    <div class="text-center py-20 text-gray-500">
      <i class="fas fa-spinner animate-spin text-4xl text-[var(--main-color)]"></i>
      <p class="mt-4 text-lg">Loading brands...</p>
    </div>
  } @else if (brandsList.length === 0) {
    <div class="text-center py-20">
      <h3 class="text-2xl font-semibold text-gray-500">No brands found.</h3>
    </div>
  } @else {
    <div class="parent grid lg:grid-cols-4 md:grid-cols-3 grid-cols-2 gap-4 mt-10">
      @for (brand of brandsList; track brand._id) {
        <div class="card overflow-hidden bg-white border rounded shadow-md p-3 group/card flex flex-col items-center text-center">
          <img [src]="brand.image" class="w-full h-36 object-contain rounded-t mb-2" [alt]="brand.name">
          <h3 class="text-sm font-semibold text-green-500 mt-1">{{ brand.name }}</h3>
        </div>
      }
    </div>
  }
</div>

<section class="bg-gray-100 py-16 border border-gray-400">
    <div class="container">
        <h2 class="text-5xl text-[var(--main-color)]">Products List</h2>
        <input type="search" (input)="search($event)" placeholder="Search Products..." class="border border-gray-400 focus:ring-2 focus:ring-[var(--main-color)]  rounded px-4 py-2 mt-4 w-full md:w-1/3">
        <div class="parent grid lg:grid-cols-6 md:grid-cols-3 grid-cols-2  gap-4 mt-10">
            @for (product of productsList | paginate: { id: 'foo',itemsPerPage: pageSize,currentPage: p,totalItems: total } | search: searchTerm; track product.id) {
            <app-card [product]="product"></app-card>
            }
        </div>
        <div class="flex justify-center mt-4">
            <pagination-controls class="my-pagination"  id="foo"
            (pageChange)="getAllProductsData($event)">
        </pagination-controls>
        </div>
    </div>
</section>
